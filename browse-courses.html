<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/styles.css" />
    <title>Browse Courses</title>
  </head>
  <body>
    <div id="sharedHeader"></div>

    <div class="main browse-page-main">
      <div class="filters">
        <div class="location">
          Home > <span style="color: rgba(79, 70, 229, 1)"> Browse </span>
        </div>
        <div class="filterstitle">
          <p>Filters</p>
          <button class="filters-clear" id="clearFiltersButton" type="button">
            Clear All Filters &#10005;
          </button>
        </div>
        <div class="filtertype">Category</div>
        <div class="browse-filter-group" id="categoryFilters"></div>
        <div class="filtertype">Topics</div>
        <div class="browse-filter-group" id="topicFilters"></div>
        <div class="filtertype">Instructor</div>
        <div
          class="browse-filter-group browse-filter-group--instructors"
          id="instructorFilters"
        ></div>
        <div class="numoffilters">0 filters active</div>
      </div>
      <div class="rightpage">
        <div class="rightlineone">
          <div class="numofshown" id="browseCoursesCount">
            Showing 0 out of 0
          </div>
          <div class="filter-sort" id="browseSort">
            <button
              class="filter-sort__header"
              id="browseSortButton"
              type="button"
              aria-expanded="false"
              aria-controls="browseSortDropdown"
            >
              <span class="filter-sort__label">Sort By:</span>
              <span class="filter-sort__selected" id="browseSortSelected"
                >Newest First</span
              >
              <span class="filter-sort__arrow" aria-hidden="true">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M6 9L12 15L18 9"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </button>

            <div class="filter-sort__dropdown" id="browseSortDropdown">
              <button
                class="filter-sort__item filter-sort__item--active"
                type="button"
                data-sort-value="newest"
              >
                Newest First
              </button>
              <button
                class="filter-sort__item"
                type="button"
                data-sort-value="price-asc"
              >
                Price: Low to High
              </button>
              <button
                class="filter-sort__item"
                type="button"
                data-sort-value="price-desc"
              >
                Price: High to Low
              </button>
              <button
                class="filter-sort__item"
                type="button"
                data-sort-value="popular"
              >
                Most Popular
              </button>
              <button
                class="filter-sort__item"
                type="button"
                data-sort-value="title-asc"
              >
                Title: A-Z
              </button>
            </div>
          </div>
        </div>
        <div class="cards browse-courses-cards" id="browseCoursesCards"></div>
        <div class="browse-pagination" id="browsePagination"></div>
      </div>
    </div>

    <div id="sharedAuthModals"></div>
    <div id="sharedFooter"></div>

    <script src="scripts/utils.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/shared-shell.js"></script>
    <script src="scripts/modal.js"></script>
    <script src="scripts/login.js"></script>
    <script src="scripts/register.js"></script>
    <script src="scripts/profile.js"></script>
    <script src="scripts/browse-courses.js"></script>
    <script src="scripts/enrolled-courses.js"></script>
    <script src="scripts/header-footer.js"></script>
  </body>
</html>
